<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionSync — Camera Configuration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: {
                        'float-slow': 'float 8s ease-in-out infinite',
                        'float-delayed': 'float 10s ease-in-out 4s infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0) scale(1)' },
                            '50%': { transform: 'translateY(-20px) scale(1.05)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-8 relative overflow-hidden">

    <div class="absolute top-0 left-0 w-72 h-72 sm:w-96 sm:h-96 bg-cyan-600/30 rounded-full mix-blend-screen filter blur-[80px] sm:blur-[120px] animate-float-slow transform -translate-x-1/2 -translate-y-1/4"></div>
    <div class="absolute bottom-0 right-0 w-72 h-72 sm:w-96 sm:h-96 bg-purple-600/30 rounded-full mix-blend-screen filter blur-[80px] sm:blur-[120px] animate-float-delayed transform translate-x-1/4 translate-y-1/4"></div>

    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 -translate-y-[150%] transition-transform duration-500 ease-out bg-emerald-400/90 text-slate-950 px-6 py-2.5 rounded-full font-bold text-sm tracking-wide shadow-[0_0_30px_rgba(52,211,153,0.4)] z-50 flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
        <span id="toast-text">SAVED</span>
    </div>

    <div class="relative z-10 w-full max-w-3xl bg-white/[0.03] backdrop-blur-2xl border border-white/10 rounded-3xl p-6 sm:p-10 shadow-[0_20px_50px_rgba(0,0,0,0.5)] h-[95vh] overflow-y-auto">

        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 sticky top-0 bg-slate-950/20 backdrop-blur-md p-2 rounded-xl z-20">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">VisionSync</h1>
                <div class="text-xs text-slate-400 font-light">Camera Configuration — by Sentivise.AI</div>
            </div>
            <div id="status-badge" class="flex items-center gap-2.5 px-4 py-1.5 rounded-full bg-white/5 border border-white/10 text-xs font-bold tracking-wider uppercase transition-all duration-300">
                <div id="status-dot" class="w-2 h-2 rounded-full bg-rose-500 shadow-[0_0_12px_rgba(244,63,94,1)] transition-colors duration-300"></div>
                <span id="status-text" class="text-slate-300">Checking Nx...</span>
            </div>
        </div>

        <!-- Camera Views -->
        <div class="pt-4 border-t border-white/5">
            <div class="flex justify-between items-start mb-3">
                <div>
                    <div class="text-sm font-semibold text-slate-200">Camera Views</div>
                    <div class="text-[11px] sm:text-xs text-slate-400 mt-1 font-light">Nx cameras this project pulls live feeds from — Customer Dwell POV and POS Camera Feed are required; add more as a project needs them</div>
                </div>
                <button onclick="refreshCameras()" title="Refresh camera list" class="text-slate-400 hover:text-cyan-400 transition-colors p-1.5 shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>

            <div id="camera-views-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- camera view cards injected by renderCameraViews() -->
            </div>

            <button onclick="addCameraSlot()" class="mt-4 w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl border border-dashed border-white/15 text-slate-400 hover:text-cyan-400 hover:border-cyan-500/40 text-sm font-semibold transition-all duration-300 active:scale-95">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Add Camera
            </button>

            <div id="camera_status_msg" class="text-[11px] text-slate-500 mt-2 font-light"></div>
        </div>

        <!-- Control -->
        <div class="grid grid-cols-1 gap-4 pt-6 mt-6 border-t border-white/5">
            <button onclick="applyParams()" class="w-full flex items-center justify-center gap-2 px-4 py-3.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 text-sm font-bold tracking-wide transition-all duration-300 active:scale-95">
                <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                Apply Params
            </button>

            <button onclick="terminateSystem()" class="w-full flex items-center justify-center gap-2 px-4 py-3.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 hover:bg-rose-500/90 hover:text-white hover:border-rose-400 text-sm font-bold tracking-wide transition-all duration-300 active:scale-95 hover:shadow-[0_10px_30px_rgba(225,29,72,0.4)]">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v8l9-11h-7z"></path></svg>
                Terminate System
            </button>
        </div>
    </div>

    <script>
        // Relative on purpose: this page is always served by camera_service.py
        // itself, so a relative path is always same-origin regardless of
        // which hostname/IP was used to load it (127.0.0.1, localhost, or a
        // LAN IP for viewing from another device) — unlike a hardcoded
        // absolute URL, which only worked when loaded via that exact host
        // and otherwise silently depended on the wildcard CORS grant below.
        const API = "/api";
        const STREAM_URL = "/api/stream";

        // Every live camera view on the page — the first two (Dwell, POS) are
        // the floor and can never be removed; anything after that came from
        // /api/camera-slots and can be added/removed freely, min 2 overall.
        // { key, label, removable, cameraId }
        let cameraViews = [];
        let allCameraEntries = [];
        let cameraOnlineMap = {};

        const OFFLINE_ICON = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3l18 18M10.5 6H16a2 2 0 012 2v7.5M6 6.5V16a2 2 0 002 2h9.5M15 10l4.553-2.276A1 1 0 0121 8.618v6.764"></path></svg>`;

        async function fetchState() {
            try {
                const [setRes, slotsRes] = await Promise.all([
                    fetch(`${API}/settings`),
                    fetch(`${API}/camera-slots`)
                ]);
                const settings = await setRes.json();
                const slots = await slotsRes.json();

                cameraViews = [
                    { key: 'DWELL_CAMERA_ID', label: 'Customer Dwell POV', removable: false, cameraId: settings.DWELL_CAMERA_ID || '' },
                    { key: 'POS_CAMERA_ID', label: 'POS Camera Feed', removable: false, cameraId: settings.POS_CAMERA_ID || '' },
                    ...slots.map(s => ({ key: s.id, label: s.label, removable: true, cameraId: s.camera_id || '' }))
                ];

                // Build the cards themselves first (this is the ONE place a
                // full rebuild is correct — there's nothing in the DOM yet)
                // before fetchCameras() fills in online status and previews.
                renderCameraViews();

                await fetchCameras();
                checkHealth();
            } catch (e) { console.error("Camera service offline", e); }
        }

        async function checkHealth() {
            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');
            try {
                const res = await fetch(`${API}/health`);
                const data = await res.json();
                if (data.nx_reachable) {
                    statusText.innerText = "NX CONNECTED";
                    statusDot.className = "w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_12px_rgba(16,185,129,1)] transition-colors duration-300";
                } else {
                    statusText.innerText = "NX UNREACHABLE";
                    statusDot.className = "w-2 h-2 rounded-full bg-amber-500 shadow-[0_0_12px_rgba(245,158,11,1)] transition-colors duration-300";
                }
            } catch (e) {
                statusText.innerText = "SERVICE OFFLINE";
                statusDot.className = "w-2 h-2 rounded-full bg-slate-500 shadow-[0_0_12px_rgba(100,116,139,1)] transition-colors duration-300";
            }
        }

        function cardHTML(view) {
            return `
            <div class="camera-card" data-key="${view.key}">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs text-slate-400 block">${view.label}</label>
                    ${view.removable ? `<button onclick="removeCameraSlot('${view.key}')" title="Remove this camera" class="text-slate-500 hover:text-rose-400 transition-colors text-xs px-1">✕</button>` : ''}
                </div>
                <div class="mb-2 rounded-xl overflow-hidden border border-white/10 relative bg-black aspect-video flex items-center justify-center">
                    <img data-role="stream" class="hidden w-full h-full object-contain" alt="${view.label} preview">
                    <div data-role="offline" class="flex flex-col items-center justify-center gap-1 text-slate-500 font-mono text-[11px]">
                        ${OFFLINE_ICON}
                        <span data-role="offline-text">NO PREVIEW</span>
                    </div>
                </div>
                <select data-role="select" onchange="handleCameraChange('${view.key}', ${view.removable})" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500/50">
                    <option value="">Loading cameras...</option>
                </select>
            </div>`;
        }

        function cardFor(key) {
            return document.querySelector(`.camera-card[data-key="${key}"]`);
        }

        // Full rebuild — only for the very first load. Every later refresh
        // must update cards in place (see refreshAllCards) so it never tears
        // down an <img> that's already streaming fine.
        function renderCameraViews() {
            const grid = document.getElementById('camera-views-grid');
            grid.innerHTML = cameraViews.map(cardHTML).join('');
            refreshAllCards();
        }

        // Updates every existing card's <select> options and preview in
        // place — never touches the <img>/<select> DOM nodes themselves, so
        // an already-connected MJPEG stream is left alone. This is what both
        // the manual refresh button and the periodic background poll call;
        // there is no separate "hard refresh" path anymore.
        function refreshAllCards() {
            cameraViews.forEach(view => {
                const card = cardFor(view.key);
                if (!card) return;
                populateSelectForCard(card, view);
                updatePreviewForCard(card, view);
            });
        }

        function populateSelectForCard(card, view) {
            const select = card.querySelector('[data-role="select"]');
            if (document.activeElement === select) return; // don't yank an open dropdown out from under the user

            if (allCameraEntries.length === 0) {
                select.innerHTML = '<option value="">No cameras found on Nx</option>';
                return;
            }

            // Always lead with an explicit "unselected" option — without one,
            // an empty view.cameraId ('' — e.g. a freshly added camera slot)
            // leaves no <option> marked selected, and the browser silently
            // falls back to showing whichever camera happens to be first in
            // the list. That LOOKED like a camera was assigned when nothing
            // had actually been saved yet.
            const sorted = [...allCameraEntries].sort((a, b) => (b.online === true) - (a.online === true));
            const placeholder = `<option value="" ${!view.cameraId ? 'selected' : ''} style="color:#64748b;background-color:#0f172a">— Select a camera —</option>`;
            select.innerHTML = placeholder + sorted.map(cam => {
                const label = `${cam.name || cam.id} ${cam.online ? '● Online' : '○ Offline'}`;
                const selected = cam.id === view.cameraId ? 'selected' : '';
                const color = cam.online ? '#34d399' : '#f43f5e';
                return `<option value="${cam.id}" ${selected} style="color:${color};background-color:#0f172a">${label}</option>`;
            }).join('');
        }

        function updatePreviewForCard(card, view) {
            const img = card.querySelector('[data-role="stream"]');
            const offlineEl = card.querySelector('[data-role="offline"]');
            const offlineText = card.querySelector('[data-role="offline-text"]');

            if (!view.cameraId) {
                img.classList.add('hidden'); img.removeAttribute('src'); img.dataset.cameraId = '';
                offlineEl.classList.remove('hidden'); offlineText.innerText = 'NO CAMERA SELECTED';
                return;
            }
            if (cameraOnlineMap[view.cameraId] === false) {
                img.classList.add('hidden'); img.removeAttribute('src'); img.dataset.cameraId = '';
                offlineEl.classList.remove('hidden'); offlineText.innerText = 'CAMERA OFFLINE';
                return;
            }
            offlineEl.classList.add('hidden');
            img.classList.remove('hidden');
            if (img.dataset.cameraId !== view.cameraId) {
                img.dataset.cameraId = view.cameraId;
                img.src = `${STREAM_URL}?camera_id=${view.cameraId}&t=${Date.now()}`;
            }
        }

        async function fetchCameras(force = false) {
            const statusMsg = document.getElementById('camera_status_msg');

            try {
                const url = force ? `${API}/cameras?force=1` : `${API}/cameras`;
                const res = await fetch(url);
                const cameras = await res.json();
                if (cameras.error || cameras.status === 'error') throw new Error(cameras.message || cameras.error);

                allCameraEntries = Object.values(cameras);
                cameraOnlineMap = {};
                allCameraEntries.forEach(cam => { cameraOnlineMap[cam.id] = cam.online; });

                refreshAllCards();
                statusMsg.innerText = "";
                return true;
            } catch (e) {
                statusMsg.innerText = "Could not reach the camera list. Is camera_service.py running?";
                console.error("Camera fetch error:", e);
                return false;
            }
        }

        // Bypasses the 5-minute server-side cache, but still only updates
        // cards in place — it never rebuilds the grid, so already-playing
        // previews keep playing straight through a manual refresh.
        async function refreshCameras() {
            const ok = await fetchCameras(true);
            showToast(ok ? "CAMERA LIST REFRESHED" : "CAMERA REFRESH FAILED", !ok);
        }

        // Shared handler for every card's <select> — fixed views (Dwell/POS)
        // save through /api/settings, added camera slots through
        // /api/camera-slots/<id>.
        async function handleCameraChange(key, removable) {
            const card = cardFor(key);
            const select = card.querySelector('[data-role="select"]');
            const newId = select.value;

            const view = cameraViews.find(v => v.key === key);
            view.cameraId = newId;
            updatePreviewForCard(card, view);

            try {
                const res = removable
                    ? await fetch(`${API}/camera-slots/${encodeURIComponent(key)}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ camera_id: newId })
                    })
                    : await fetch(`${API}/settings`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ [key]: newId })
                    });
                if (!res.ok) throw new Error("Save failed");
                showToast(`${view.label.toUpperCase()} UPDATED`, false);
            } catch (e) {
                showToast("FAILED TO SAVE CAMERA", true);
                console.error("Camera save error:", e);
            }
        }

        // Only inserts the one new card — existing cards are left completely
        // alone, so their live previews don't reconnect just because a
        // different camera was added.
        async function addCameraSlot() {
            try {
                const res = await fetch(`${API}/camera-slots`, { method: 'POST' });
                if (!res.ok) throw new Error("Failed");
                const slot = await res.json();
                const view = { key: slot.id, label: slot.label, removable: true, cameraId: '' };
                cameraViews.push(view);

                document.getElementById('camera-views-grid').insertAdjacentHTML('beforeend', cardHTML(view));
                const card = cardFor(view.key);
                populateSelectForCard(card, view);
                updatePreviewForCard(card, view);

                showToast("CAMERA ADDED", false);
            } catch (e) {
                showToast("FAILED TO ADD CAMERA", true);
                console.error("Add camera error:", e);
            }
        }

        // Only removes the one card — same reasoning as addCameraSlot.
        async function removeCameraSlot(key) {
            if (!confirm("Remove this camera view?")) return;
            try {
                const res = await fetch(`${API}/camera-slots/${encodeURIComponent(key)}`, { method: 'DELETE' });
                if (!res.ok) throw new Error("Failed");
                cameraViews = cameraViews.filter(v => v.key !== key);
                const card = cardFor(key);
                if (card) card.remove();
                showToast("CAMERA REMOVED", false);
            } catch (e) {
                showToast("FAILED TO REMOVE CAMERA", true);
                console.error("Remove camera error:", e);
            }
        }

        // "Apply Params" has no sliders of its own to save here (ROI and the
        // Face-Rec engine's own params intentionally live in their own
        // modules, not VisionSync) — it re-POSTs the Dwell/POS camera picks
        // as a manual "confirm/save" action mirroring the button in the
        // original settings.html dashboard. Added camera slots already save
        // instantly on change, so there's nothing extra to apply for those.
        async function applyParams() {
            const dwell = cameraViews.find(v => v.key === 'DWELL_CAMERA_ID');
            const pos = cameraViews.find(v => v.key === 'POS_CAMERA_ID');
            try {
                const res = await fetch(`${API}/settings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        DWELL_CAMERA_ID: dwell ? dwell.cameraId : '',
                        POS_CAMERA_ID: pos ? pos.cameraId : ''
                    })
                });
                if (!res.ok) throw new Error("Save failed");
                showToast("PARAMETERS APPLIED", false);
            } catch (e) {
                showToast("FAILED TO APPLY PARAMETERS", true);
                console.error("Apply params error:", e);
            }
        }

        // Stops camera_service.py, then closes this tab. window.close() only
        // works in browsers that let a page close a tab it didn't itself
        // open with window.open() — if it doesn't close, the service is
        // still down; just close the tab by hand.
        async function terminateSystem() {
            if (!confirm("Shut down VisionSync completely? This stops the camera service and closes this tab.")) return;
            try {
                await fetch(`${API}/system/shutdown`, { method: 'POST' });
            } catch (e) {
                // Service may already be on its way down — ignore.
            }
            showToast("SYSTEM SHUTDOWN INITIATED", true);
            setTimeout(() => window.close(), 1500);
        }

        function showToast(message, isDanger) {
            const t = document.getElementById('toast');
            document.getElementById('toast-text').innerText = message;
            if (isDanger) {
                t.classList.remove('bg-emerald-400/90', 'shadow-[0_0_30px_rgba(52,211,153,0.4)]');
                t.classList.add('bg-rose-500/90', 'shadow-[0_0_30px_rgba(244,63,94,0.4)]', 'text-white');
            } else {
                t.classList.add('bg-emerald-400/90', 'shadow-[0_0_30px_rgba(52,211,153,0.4)]');
                t.classList.remove('bg-rose-500/90', 'shadow-[0_0_30px_rgba(244,63,94,0.4)]', 'text-white');
            }
            t.classList.remove('-translate-y-[150%]');
            setTimeout(() => t.classList.add('-translate-y-[150%]'), 3000);
        }

        fetchState();
        setInterval(checkHealth, 5000);
        setInterval(() => fetchCameras(), 8000);
    </script>
</body>
</html>
